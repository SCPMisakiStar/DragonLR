name: Android SDK ARM64 build check

on:
  workflow_dispatch:
  push:
    branches: [android-port]
    paths:
      - 'patches/rexglue-sdk/**'
      - 'tools/patch_rexglue_android.py'
      - 'platform/android/**'
      - 'android/**'
      - 'src/main.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/android-sdk.yml'

permissions:
  contents: read

jobs:
  build-rexglue-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out DragonLR
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;27.2.12479018 cmake;3.31.6

      - name: Export Android NDK path
        shell: bash
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Check out ReXGlue SDK v0.10.0
        uses: actions/checkout@v4
        with:
          repository: rexglue/rexglue-sdk
          ref: v0.10.0
          path: rexglue-sdk-0.10
          submodules: recursive

      - name: Apply DragonLR SDK overlays
        shell: bash
        run: |
          python3 -m py_compile tools/patch_rexglue_android.py
          cp -a patches/rexglue-sdk/. rexglue-sdk-0.10/
          python3 tools/patch_rexglue_android.py rexglue-sdk-0.10
          grep -n 'android-arm64' rexglue-sdk-0.10/CMakeLists.txt
          grep -n 'surface_android.cpp' rexglue-sdk-0.10/src/ui/CMakeLists.txt
          grep -n 'REXGLUE_DRAGONLR_ANDROID_SURFACE' rexglue-sdk-0.10/src/ui/window_sdl.cpp

      - name: Configure ReXGlue for Android ARM64
        shell: bash
        run: |
          cmake -S rexglue-sdk-0.10 -B out/build/android-sdk-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/rexglue-android" \
            -DREXGLUE_USE_D3D12=OFF \
            -DREXGLUE_USE_VULKAN=ON \
            -DREXGLUE_ENABLE_TRACY=OFF \
            -DREXGLUE_ENABLE_FIDELITYFX=OFF \
            -DREXGLUE_BUILD_TESTS=OFF

      - name: Build ReXGlue runtime and Xenos Vulkan plugin
        run: |
          cmake --build out/build/android-sdk-arm64 --target rexruntime rexgpu-xenos --parallel 2

      - name: Install Android SDK package
        run: cmake --install out/build/android-sdk-arm64

      - name: Configure DragonLR Android ARM64 native target
        shell: bash
        run: |
          cmake -S . -B out/build/dragonlr-android-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/rexglue-android" \
            -DDBZ3_PLATFORM_DIR="$GITHUB_WORKSPACE/platform/android" \
            -DDBZ3_GENERATED_DIR=generated \
            -DDBZ3_DUAL_REGION=OFF

      - name: Build DragonLR Android native library
        run: cmake --build out/build/dragonlr-android-arm64 --target dbz3 --parallel 2

      - name: Verify ARM64 outputs
        shell: bash
        run: |
          find rexglue-android -type f -name '*.so' -print
          test -n "$(find rexglue-android -type f -name 'librexruntime.so' -print -quit)"
          test -n "$(find rexglue-android -type f -name 'librexgpu-xenos.so' -print -quit)"
          test -n "$(find rexglue-android -type f -name 'libSDL3.so' -print -quit)"
          file "$(find rexglue-android -type f -name 'librexruntime.so' -print -quit)" | grep -q 'ARM aarch64'
          file "$(find rexglue-android -type f -name 'librexgpu-xenos.so' -print -quit)" | grep -q 'ARM aarch64'
          file "$(find rexglue-android -type f -name 'libSDL3.so' -print -quit)" | grep -q 'ARM aarch64'
          test -n "$(find out/build/dragonlr-android-arm64 out -type f -name 'libmain.so' -print -quit)"
          test -n "$(find out/build/dragonlr-android-arm64 out -type f -name 'librexgpu-xenos.so' -print -quit)"
          file "$(find out/build/dragonlr-android-arm64 out -type f -name 'libmain.so' -print -quit)" | grep -q 'ARM aarch64'
          file "$(find out/build/dragonlr-android-arm64 out -type f -name 'librexgpu-xenos.so' -print -quit)" | grep -q 'ARM aarch64'

      - name: Upload DragonLR Android native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dragonlr-android-arm64-native
          path: |
            out/**/libmain.so
            out/**/librexgpu-xenos.so
          if-no-files-found: error

      - name: Upload Android SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dragonlr-rexglue-android-arm64
          path: rexglue-android/
          if-no-files-found: error
