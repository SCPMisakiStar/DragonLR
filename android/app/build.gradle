plugins {
    id "com.android.application"
}

def repoRoot = rootProject.projectDir.parentFile

// The Xenos GPU backend is loaded with dlopen at runtime, not linked to
// libmain.so. Stage it explicitly so AGP packages it in lib/arm64-v8a.
def rexglueGpuPlugin = new File(repoRoot, "rexglue-android/lib/librexgpu-xenos.so")
def jniLibsArm64 = file("src/main/jniLibs/arm64-v8a")

tasks.register("stageReXGlueGpuPlugin", Copy) {
    from(rexglueGpuPlugin)
    into(jniLibsArm64)
    doFirst {
        if (!rexglueGpuPlugin.isFile()) {
            throw new GradleException("Missing ReXGlue Android GPU plugin: ${rexglueGpuPlugin}")
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("stageReXGlueGpuPlugin")
}

android {
    namespace "com.dragonlr"
    ndkVersion "27.2.12479018"
    compileSdk 35

    defaultConfig {
        applicationId "com.dragonlr"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments(
                    "-DANDROID_STL=c++_shared",
                    "-DDBZ3_PLATFORM_DIR=${new File(repoRoot, 'platform/android').absolutePath}",
                    "-DCMAKE_PREFIX_PATH=${new File(repoRoot, 'rexglue-android').absolutePath}",
                    "-Drexglue_DIR=${new File(repoRoot, 'rexglue-android/lib/cmake/rexglue').absolutePath}",
                    "-Dfmt_DIR=${new File(repoRoot, 'rexglue-android/lib/cmake/fmt').absolutePath}",
                    "-Dspdlog_DIR=${new File(repoRoot, 'rexglue-android/lib/cmake/spdlog').absolutePath}",
                    "-Dutf8cpp_DIR=${new File(repoRoot, 'rexglue-android/share/utf8cpp/cmake').absolutePath}",
                    "-DSDL3_DIR=${new File(repoRoot, 'rexglue-android/lib/cmake/SDL3').absolutePath}",
                    "-DVulkanHeaders_DIR=${new File(repoRoot, 'rexglue-android/share/cmake/VulkanHeaders').absolutePath}",
                    "-DVulkanMemoryAllocator_DIR=${new File(repoRoot, 'rexglue-android/share/cmake/VulkanMemoryAllocator').absolutePath}",
                    "-DDBZ3_GENERATED_DIR=generated",
                    "-DDBZ3_DUAL_REGION=OFF"
                )
                cppFlags "-std=c++23"
                targets "dbz3"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.31.6"
        }
    }

    packaging {
        jniLibs {
            // Ensure dladdr() resolves native libraries to a real nativeLibraryDir.
            useLegacyPackaging = true
        }
    }

    sourceSets {
        main {
            java.srcDirs += file("../../rexglue-sdk-0.10/thirdparty/sdl3/android-project/app/src/main/java")
            jniLibs.srcDirs += file("src/main/jniLibs")
        }
    }
}
